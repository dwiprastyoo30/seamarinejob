  <script>


    /* =========================================================
       SUPABASE
    ========================================================= */


    const SUPABASE_URL =
      "https://pnyqdhcaabpxbatpubcb.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_O4NAGkMZpJIk8fGfHkAxjQ_ZpegzAfA";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /* =========================================================
       STATE
    ========================================================= */


    let allJobs = [];

    let filteredJobs = [];

    let currentPage = 1;

    let pageSize = 8;



    /* =========================================================
       ELEMENTS
    ========================================================= */


    const keywordInput =
      document.getElementById(
        "keywordInput"
      );


    const locationFilter =
      document.getElementById(
        "locationFilter"
      );


    const vesselFilter =
      document.getElementById(
        "vesselFilter"
      );


    const departmentFilter =
      document.getElementById(
        "departmentFilter"
      );


    const employmentFilter =
      document.getElementById(
        "employmentFilter"
      );


    const sortFilter =
      document.getElementById(
        "sortFilter"
      );


    const pageSizeSelect =
      document.getElementById(
        "pageSizeSelect"
      );


    const resetButton =
      document.getElementById(
        "resetButton"
      );


    const jobsGrid =
      document.getElementById(
        "jobsGrid"
      );


    const pagination =
      document.getElementById(
        "pagination"
      );


    const resultsInfo =
      document.getElementById(
        "resultsInfo"
      );



    /* =========================================================
       ESCAPE HTML
    ========================================================= */


    function escapeHtml(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    /* =========================================================
       NORMALIZE
    ========================================================= */


    function normalize(
      value
    ) {

      return String(
        value || ""
      )
        .toLowerCase()
        .trim();

    }



    /* =========================================================
       FORMAT DATE
    ========================================================= */


    function formatDate(
      dateValue
    ) {

      if (!dateValue) {
        return "-";
      }


      const date =
        new Date(
          dateValue
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "-";
      }


      return date.toLocaleDateString(
        "id-ID",
        {
          day: "2-digit",
          month: "short",
          year: "numeric"
        }
      );

    }



    /* =========================================================
       LOAD JOBS
    ========================================================= */


    async function loadJobs() {

      jobsGrid.innerHTML =
        `
          <div class="loading">
            Memuat lowongan...
          </div>
        `;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("jobs")
          .select(`
            id,
            created_at,
            title,
            company_name,
            location,
            vessel_type,
            employment_type,
            salary,
            description,
            requirements,
            status,
            posted_by,
            department
          `)
          .in(
            "status",
            [
              "published",
              "active"
            ]
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(
          "Load jobs error:",
          error
        );


        jobsGrid.innerHTML =
          `
            <div class="error-state">

              <strong>
                Lowongan gagal dimuat.
              </strong>

              <br>

              ${escapeHtml(
                error.message
              )}

            </div>
          `;


        resultsInfo.textContent =
          "Tidak dapat memuat lowongan.";


        pagination.innerHTML =
          "";


        return;
      }


      allJobs =
        data || [];


      populateFilters();


      applyFilters();

    }



    /* =========================================================
       GET UNIQUE VALUES
    ========================================================= */


    function getUniqueValues(
      field
    ) {

      return [
        ...new Set(
          allJobs
            .map(
              job =>
                String(
                  job[field] ||
                  ""
                ).trim()
            )
            .filter(
              value =>
                value !== ""
            )
        )
      ].sort(
        (a, b) =>
          a.localeCompare(
            b,
            "id",
            {
              sensitivity:
                "base"
            }
          )
      );

    }



    /* =========================================================
       POPULATE FILTERS
    ========================================================= */


    function populateFilters() {

      populateSelect(
        locationFilter,
        getUniqueValues(
          "location"
        ),
        "Semua Lokasi"
      );


      populateSelect(
        vesselFilter,
        getUniqueValues(
          "vessel_type"
        ),
        "Semua Jenis Kapal"
      );


      populateSelect(
        departmentFilter,
        getUniqueValues(
          "department"
        ),
        "Semua Departemen"
      );


      populateSelect(
        employmentFilter,
        getUniqueValues(
          "employment_type"
        ),
        "Semua Tipe"
      );

    }



    function populateSelect(
      selectElement,
      values,
      defaultLabel
    ) {

      const previousValue =
        selectElement.value;


      selectElement.innerHTML =
        "";


      const defaultOption =
        document.createElement(
          "option"
        );


      defaultOption.value =
        "";


      defaultOption.textContent =
        defaultLabel;


      selectElement.appendChild(
        defaultOption
      );


      values.forEach(
        value => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            value;


          option.textContent =
            value;


          selectElement.appendChild(
            option
          );

        }
      );


      if (
        values.includes(
          previousValue
        )
      ) {

        selectElement.value =
          previousValue;

      }

    }



    /* =========================================================
       APPLY FILTERS
    ========================================================= */


    function applyFilters() {

      const keyword =
        normalize(
          keywordInput.value
        );


      const location =
        normalize(
          locationFilter.value
        );


      const vessel =
        normalize(
          vesselFilter.value
        );


      const department =
        normalize(
          departmentFilter.value
        );


      const employment =
        normalize(
          employmentFilter.value
        );


      filteredJobs =
        allJobs.filter(
          job => {

            const searchableText =
              [
                job.title,
                job.company_name,
                job.location,
                job.vessel_type,
                job.department,
                job.employment_type,
                job.salary
              ]
                .map(
                  normalize
                )
                .join(" ");


            const matchesKeyword =
              !keyword ||
              searchableText.includes(
                keyword
              );


            const matchesLocation =
              !location ||
              normalize(
                job.location
              ) === location;


            const matchesVessel =
              !vessel ||
              normalize(
                job.vessel_type
              ) === vessel;


            const matchesDepartment =
              !department ||
              normalize(
                job.department
              ) === department;


            const matchesEmployment =
              !employment ||
              normalize(
                job.employment_type
              ) === employment;


            return (
              matchesKeyword &&
              matchesLocation &&
              matchesVessel &&
              matchesDepartment &&
              matchesEmployment
            );

          }
        );


      sortJobs();


      currentPage =
        1;


      render();

    }



    /* =========================================================
       SORT
    ========================================================= */


    function sortJobs() {

      const sortValue =
        sortFilter.value;


      filteredJobs.sort(
        (a, b) => {

          if (
            sortValue ===
            "az"
          ) {

            return normalize(
              a.title
            ).localeCompare(
              normalize(
                b.title
              ),
              "id"
            );

          }


          if (
            sortValue ===
            "za"
          ) {

            return normalize(
              b.title
            ).localeCompare(
              normalize(
                a.title
              ),
              "id"
            );

          }


          if (
            sortValue ===
            "oldest"
          ) {

            return (
              new Date(
                a.created_at
              ).getTime() -
              new Date(
                b.created_at
              ).getTime()
            );

          }


          return (
            new Date(
              b.created_at
            ).getTime() -
            new Date(
              a.created_at
            ).getTime()
          );

        }
      );

    }



    /* =========================================================
       RENDER
    ========================================================= */


    function render() {

      const total =
        filteredJobs.length;


      const totalPages =
        Math.max(
          1,
          Math.ceil(
            total /
            pageSize
          )
        );


      if (
        currentPage >
        totalPages
      ) {

        currentPage =
          totalPages;

      }


      const startIndex =
        (
          currentPage -
          1
        ) *
        pageSize;


      const endIndex =
        startIndex +
        pageSize;


      const visibleJobs =
        filteredJobs.slice(
          startIndex,
          endIndex
        );


      renderResultsInfo(
        total,
        startIndex,
        visibleJobs.length
      );


      renderJobs(
        visibleJobs
      );


      renderPagination(
        totalPages
      );

    }



    /* =========================================================
       RESULTS INFO
    ========================================================= */


    function renderResultsInfo(
      total,
      startIndex,
      visibleCount
    ) {

      if (
        total === 0
      ) {

        resultsInfo.innerHTML =
          `
            Tidak ada lowongan yang cocok.
          `;

        return;
      }


      const first =
        startIndex + 1;


      const last =
        startIndex +
        visibleCount;


      resultsInfo.innerHTML =
        `
          Menampilkan
          <strong>
            ${first}-${last}
          </strong>
          dari
          <strong>
            ${total}
          </strong>
          lowongan
        `;

    }



    /* =========================================================
       RENDER JOBS
    ========================================================= */


    function renderJobs(
      jobs
    ) {

      if (
        !jobs.length
      ) {

        jobsGrid.innerHTML =
          `
            <div class="empty-state">

              <div class="empty-icon">
                🔎
              </div>

              <h3>
                Lowongan tidak ditemukan
              </h3>

              <p>
                Coba ubah kata kunci atau filter pencarian
                untuk melihat lowongan lainnya.
              </p>

            </div>
          `;

        return;
      }


      jobsGrid.innerHTML =
        jobs
          .map(
            job => {

              const description =
                job.description ||
                "Deskripsi pekerjaan belum tersedia.";


              const department =
                job.department ||
                "Tidak disebutkan";


              const vesselType =
                job.vessel_type ||
                "Tidak disebutkan";


              const employmentType =
                job.employment_type ||
                "Tidak disebutkan";


              const location =
                job.location ||
                "Tidak disebutkan";


              const salary =
                job.salary ||
                "Gaji tidak dicantumkan";


              return `
                <article class="job-card">


                  <div class="job-top">

                    <div>

                      <h2 class="job-title">
                        ${escapeHtml(
                          job.title
                        )}
                      </h2>

                      <div class="job-company">
                        ${escapeHtml(
                          job.company_name ||
                          "Perusahaan"
                        )}
                      </div>

                    </div>


                    <span class="job-status">
                      Aktif
                    </span>

                  </div>



                  <div class="job-meta">


                    <div class="meta-item">

                      <div class="meta-label">
                        Lokasi
                      </div>

                      <div class="meta-value">
                        ${escapeHtml(
                          location
                        )}
                      </div>

                    </div>


                    <div class="meta-item">

                      <div class="meta-label">
                        Jenis Kapal
                      </div>

                      <div class="meta-value">
                        ${escapeHtml(
                          vesselType
                        )}
                      </div>

                    </div>


                    <div class="meta-item">

                      <div class="meta-label">
                        Departemen
                      </div>

                      <div class="meta-value">
                        ${escapeHtml(
                          department
                        )}
                      </div>

                    </div>


                    <div class="meta-item">

                      <div class="meta-label">
                        Tipe Pekerjaan
                      </div>

                      <div class="meta-value">
                        ${escapeHtml(
                          employmentType
                        )}
                      </div>

                    </div>


                  </div>



                  <p class="job-description">
                    ${escapeHtml(
                      description
                    )}
                  </p>



                  <div class="job-footer">

                    <div>

                      <div class="job-salary">
                        ${escapeHtml(
                          salary
                        )}
                      </div>

                      <div
                        style="
                          color:#71839b;
                          font-size:11px;
                          margin-top:5px;
                        "
                      >
                        Diposting
                        ${formatDate(
                          job.created_at
                        )}
                      </div>

                    </div>


                    <a
                      class="detail-button"
                      href="detail.html?id=${encodeURIComponent(
                        job.id
                      )}"
                    >
                      Lihat Detail
                    </a>

                  </div>


                </article>
              `;

            }
          )
          .join("");

    }



    /* =========================================================
       PAGINATION
    ========================================================= */


    function renderPagination(
      totalPages
    ) {

      pagination.innerHTML =
        "";


      if (
        totalPages <= 1
      ) {
        return;
      }


      const previousButton =
        document.createElement(
          "button"
        );


      previousButton.type =
        "button";


      previousButton.className =
        "page-button";


      previousButton.textContent =
        "‹";


      previousButton.disabled =
        currentPage === 1;


      previousButton.addEventListener(
        "click",
        () => {

          if (
            currentPage >
            1
          ) {

            currentPage--;

            render();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          }

        }
      );


      pagination.appendChild(
        previousButton
      );


      const pages =
        getPageNumbers(
          totalPages,
          currentPage
        );


      pages.forEach(
        page => {

          if (
            page ===
            "..."
          ) {

            const dots =
              document.createElement(
                "span"
              );


            dots.className =
              "page-dots";


            dots.textContent =
              "…";


            pagination.appendChild(
              dots
            );


            return;
          }


          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.className =
            "page-button";


          button.textContent =
            page;


          if (
            page ===
            currentPage
          ) {

            button.classList.add(
              "active"
            );

          }


          button.addEventListener(
            "click",
            () => {

              currentPage =
                page;

              render();

              window.scrollTo({
                top: 0,
                behavior: "smooth"
              });

            }
          );


          pagination.appendChild(
            button
          );

        }
      );


      const nextButton =
        document.createElement(
          "button"
        );


      nextButton.type =
        "button";


      nextButton.className =
        "page-button";


      nextButton.textContent =
        "›";


      nextButton.disabled =
        currentPage ===
        totalPages;


      nextButton.addEventListener(
        "click",
        () => {

          if (
            currentPage <
            totalPages
          ) {

            currentPage++;

            render();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          }

        }
      );


      pagination.appendChild(
        nextButton
      );

    }



    /* =========================================================
       PAGE NUMBERS
    ========================================================= */


    function getPageNumbers(
      totalPages,
      current
    ) {

      if (
        totalPages <= 7
      ) {

        return Array.from(
          {
            length:
              totalPages
          },
          (
            _,
            index
          ) =>
            index + 1
        );

      }


      const pages = [];


      pages.push(
        1
      );


      if (
        current > 4
      ) {

        pages.push(
          "..."
        );

      }


      const start =
        Math.max(
          2,
          current - 1
        );


      const end =
        Math.min(
          totalPages - 1,
          current + 1
        );


      for (
        let page = start;
        page <= end;
        page++
      ) {

        pages.push(
          page
        );

      }


      if (
        current <
        totalPages - 3
      ) {

        pages.push(
          "..."
        );

      }


      pages.push(
        totalPages
      );


      return pages;

    }



    /* =========================================================
       RESET
    ========================================================= */


    function resetFilters() {

      keywordInput.value =
        "";


      locationFilter.value =
        "";


      vesselFilter.value =
        "";


      departmentFilter.value =
        "";


      employmentFilter.value =
        "";


      sortFilter.value =
        "newest";


      currentPage =
        1;


      applyFilters();

    }



    /* =========================================================
       EVENTS
    ========================================================= */


    keywordInput.addEventListener(
      "input",
      () => {

        applyFilters();

      }
    );


    locationFilter.addEventListener(
      "change",
      () => {

        applyFilters();

      }
    );


    vesselFilter.addEventListener(
      "change",
      () => {

        applyFilters();

      }
    );


    departmentFilter.addEventListener(
      "change",
      () => {

        applyFilters();

      }
    );


    employmentFilter.addEventListener(
      "change",
      () => {

        applyFilters();

      }
    );


    sortFilter.addEventListener(
      "change",
      () => {

        currentPage =
          1;

        sortJobs();

        render();

      }
    );


    pageSizeSelect.addEventListener(
      "change",
      () => {

        pageSize =
          Number(
            pageSizeSelect.value
          );


        currentPage =
          1;


        render();

      }
    );


    resetButton.addEventListener(
      "click",
      resetFilters
    );



    /* =========================================================
       START
    ========================================================= */


    loadJobs();

  </script>


</body>
